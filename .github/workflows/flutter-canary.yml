name: Flutter stable canary
# Early warning: builds against the newest Flutter stable, not the pinned one.
# A red run here means the next migration needs work; it never blocks merges.
on:
  schedule:
    - cron: '30 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Drop the SDK pin for this run
        run: |
          sed -i '/^  flutter: [0-9]/d' pubspec.yaml
      - run: flutter --version
      - run: flutter pub upgrade --major-versions
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
